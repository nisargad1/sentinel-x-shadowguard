apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartguard-gateway
  namespace: sentinel-x
  labels:
    app: smartguard-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smartguard-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: smartguard-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: ghcr.io/nisargad1/sentinel-x-smartguard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smartguard-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: smartguard-secrets
                  key: redis-url
            - name: HMAC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smartguard-secrets
                  key: hmac-secret-key
            - name: RATE_LIMIT_ENABLED
              value: "true"
            - name: DEFAULT_RATE_LIMIT_PER_MINUTE
              value: "500"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: smartguard-gateway-service
  namespace: sentinel-x
spec:
  type: ClusterIP
  selector:
    app: smartguard-gateway
  ports:
    - port: 80
      targetPort: 8000
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smartguard-gateway-hpa
  namespace: sentinel-x
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smartguard-gateway
  minReplicas: 3
  maxReplicas: 25
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
