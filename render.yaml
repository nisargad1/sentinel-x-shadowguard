services:
  - type: web
    name: sentinel-x-shadowguard
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: HMAC_SECRET
        generateValue: true
      - key: ALLOW_DECEPTION_SANDBOX
        value: "true"
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
