events {
    worker_connections 2048;
}

http {
    upstream smartguard_cluster {
        least_conn;
        server smartguard-gateway-1:8000 max_fails=3 fail_timeout=10s;
        server smartguard-gateway-2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        location / {
            proxy_pass http://smartguard_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /health {
            proxy_pass http://smartguard_cluster/health;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /metrics {
            proxy_pass http://smartguard_cluster/metrics;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
